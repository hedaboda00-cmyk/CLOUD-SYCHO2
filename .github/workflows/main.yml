- name: Install and Start Ngrok
        run: |
          # Chocolatey দিয়ে Ngrok ইন্সটল
          choco install ngrok -y
          
          # Authtoken সেটআপ
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          
          # ব্যাকগ্রাউন্ডে Ngrok চালু করা
          Start-Process -FilePath "ngrok" -ArgumentList "tcp 3389" -WindowStyle Hidden
          
          # Ngrok API তৈরি হওয়া পর্যন্ত অপেক্ষা ও রিট্রাই করা
          $address = $null
          $retries = 0
          while (-not $address -and $retries -lt 12) {
              Start-Sleep -Seconds 3
              try {
                  $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -ErrorAction Stop
                  if ($response.tunnels.Length -gt 0) {
                      $address = $response.tunnels[0].public_url -replace 'tcp://', ''
                  }
              } catch {
                  Write-Host "Waiting for Ngrok API to start... ($retries)"
              }
              $retries++
          }

          if (-not $address) {
              Write-Error "Ngrok start failed or Auth Token is invalid!"
              exit 1
          }
          
          Write-Host "`n=============================================="
          Write-Host "CONNECT ADDRESS : $address"
          Write-Host "USERNAME        : CLOUD_PSYCHO"
          Write-Host "PASSWORD        : Psycho@2026#"
          Write-Host "==============================================`n"
